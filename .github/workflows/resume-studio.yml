name: Resume Studio — Cloudflare

on:
  push:
    branches: [main]
    paths: ['apps/resume-studio/**', '.github/workflows/resume-studio.yml']
  pull_request:
    paths: ['apps/resume-studio/**', '.github/workflows/resume-studio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resume-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/resume-studio/package-lock.json
      - run: npm ci
      - run: npm run build:review
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resume-studio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.RESUME_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.RESUME_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/resume-studio/package-lock.json
      - name: Check Cloudflare account access
        run: |
          node --input-type=module <<'JS'
          const missing=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID'].filter(name=>!process.env[name]);
          if(missing.length){console.error('Deployment blocked: add these repository secrets: '+missing.join(', '));process.exit(1);}
          if(Boolean(process.env.GOOGLE_CLIENT_ID)!==Boolean(process.env.GOOGLE_CLIENT_SECRET)){console.error('Set both RESUME_GOOGLE_CLIENT_ID and RESUME_GOOGLE_CLIENT_SECRET.');process.exit(1);}
          JS
      - run: npm ci
      - name: Provision database, migrate and deploy the resume subdomain
        run: npm run deploy
      - name: Configure Google sign-in when repository credentials are supplied
        if: env.GOOGLE_CLIENT_ID != '' && env.GOOGLE_CLIENT_SECRET != ''
        run: |
          node --input-type=module -e 'process.stdout.write(JSON.stringify({GOOGLE_CLIENT_ID:process.env.GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET:process.env.GOOGLE_CLIENT_SECRET}))' | npx wrangler secret bulk
